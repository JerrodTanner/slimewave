<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Set iframe to take full width and height of the viewport */
        iframe {
            width: 100vw;   /* Full width of the viewport */
            height: 100vh;  /* Full height of the viewport */
            border: none;   /* Optional: Remove border around the iframe */
        }

        /* Optional: Set body and html to ensure no overflow or margins */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;  /* Prevent scrollbars */
        }
    </style>
</head>
<body>
<iframe src="../PDFs/Jerrod Tanner Resume.pdf"></iframe>
</body>
</html>
