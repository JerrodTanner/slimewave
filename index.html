<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.6.1/dist/htmx.js"></script>
</head>
<body class="bg-[#d8c8a9] p-5 font-sans">

<!-- Back to Home Button -->
<div class="absolute top-5 right-5">
    <a href="/index" class="bg-blue-600 text-white py-2 px-4 rounded-md shadow-md hover:bg-blue-700 transition-all">
        Back To Home
    </a>
</div>

<div class="container max-w-screen-lg mx-auto mt-12">
    <h1 class="text-3xl text-gray-800 text-center mb-6">Audio Player</h1>

    <div id="music-list" class="space-y-8">
        <!-- Music tracks will be dynamically loaded here -->
    </div>
</div>

<script>
    function loadMusic() {
        fetch('/music')
            .then(response => response.json())
            .then(data => {
                const musicList = document.getElementById('music-list');
                data.forEach(track => {
                    // Creating audio player
                    const audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = track.file;
                    audio.innerHTML = 'Your browser does not support the audio element.';

                    // Title and Artist Info
                    const title = document.createElement('p');
                    title.textContent = `${track.title} by ${track.artist} from the album ${track.album}`;
                    title.classList.add('text-lg', 'text-gray-800', 'text-center', 'mb-4');

                    // Album cover image
                    const image = document.createElement('img');
                    image.src = track.image;
                    image.alt = `${track.album} cover`;
                    image.classList.add('rounded-md', 'shadow-lg', 'hover:shadow-xl', 'transition-all', 'max-w-xs', 'mx-auto');

                    // Wrapper div
                    const div = document.createElement('div');
                    div.classList.add('bg-[#a77f5b]', 'p-6', 'rounded-lg', 'hover:bg-[#8e6c4b]', 'transition-all');
                    div.appendChild(image);
                    div.appendChild(title);
                    div.appendChild(audio);

                    musicList.appendChild(div);
                });
            })
            .catch(error => console.error('Error loading music:', error));
    }

    document.addEventListener('DOMContentLoaded', loadMusic);
</script>

</body>
</html>
