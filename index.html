<!DOCTYPE html>
<html>
<head>
    <title>Audio Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.6.1/dist/htmx.js"></script>
</head>
<body>
    <div class="container">
        <h1>Audio Player</h1>
        <div id="music-list">
            <!-- Music tracks will be dynamically loaded here -->
        </div>
    </div>

    <script>
        function loadMusic() {
            fetch('/music')
                .then(response => response.json())
                .then(data => {
                    const musicList = document.getElementById('music-list');
                    data.forEach(track => {
                        const audio = document.createElement('audio');
                        audio.controls = true;
                        audio.src = track.file;
                        audio.innerHTML = 'Your browser does not support the audio element.';
                        
                        const title = document.createElement('p');
                        title.textContent = `${track.title} by ${track.artist} from the album ${track.album}`;

                        const image = document.createElement('img');
                        image.src = track.image;
                        image.alt = `${track.album} cover`;

                        const div = document.createElement('div');
                        div.appendChild(audio);
                        div.appendChild(title);
                        div.appendChild(image);

                        musicList.appendChild(div);
                    });
                })
                .catch(error => console.error('Error loading music:', error));
        }

        document.addEventListener('DOMContentLoaded', loadMusic);
    </script>
</body>
</html>
