<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Artists</h1>
    <ul hx-get="/music" hx-target="#albums" hx-swap="outerHTML">
        <li hx-get="/music?artist={{ artist }}">{{ artist }}</li>
    </ul>

    <h1 id="albums"></h1>
    <div id="album-covers" hx-boost>
        <!-- Album covers will be dynamically loaded here -->
    </div>

    <h1 id="songs"></h1>
    <ul id="song-list" hx-boost>
        <!-- Song list will be dynamically loaded here -->
    </ul>

    <script src="https://unpkg.com/htmx.org/dist/htmx.js"></script>
    <script>
        document.body.addEventListener('click', function(event) {
            if (event.target.tagName === 'LI') {
                document.getElementById('albums').innerText = event.target.innerText + ' Albums';
                document.getElementById('album-covers').innerHTML = '';
                document.getElementById('songs').innerText = '';

                fetch('/music?artist=' + event.target.innerText)
                    .then(response => response.json())
                    .then(data => {
                        data.forEach(album => {
                            const albumCover = document.createElement('img');
                            albumCover.src = album.image;
                            albumCover.alt = album.album;
                            albumCover.title = album.album;
                            albumCover.style.cursor = 'pointer';
                            albumCover.style.marginRight = '10px';
                            albumCover.addEventListener('click', function() {
                                document.getElementById('songs').innerText = album.album + ' Songs';
                                fetch('/music?artist=' + album.artist + '&album=' + album.album)
                                    .then(response => response.json())
                                    .then(data => {
                                        const songList = document.getElementById('song-list');
                                        songList.innerHTML = '';
                                        data.forEach(song => {
                                            const songItem = document.createElement('li');
                                            songItem.innerText = song.title;
                                            songList.appendChild(songItem);
                                        });
                                    });
                            });
                            document.getElementById('album-covers').appendChild(albumCover);
                        });
                    });
            }
        });
    </script>
</body>
</html>
