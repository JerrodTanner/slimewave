<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Artists</h1>
    <ul id="artist-list" hx-get="/artists" hx-swap="outerHTML">
        <!-- Artists will be dynamically loaded here -->
    </ul>

    <h1 id="albums"></h1>
    <div id="album-covers" hx-boost>
        <!-- Album covers will be dynamically loaded here -->
    </div>

    <script src="https://unpkg.com/htmx.org/dist/htmx.js"></script>
    <script>
        document.body.addEventListener('click', function(event) {
            if (event.target.tagName === 'LI') {
                document.getElementById('albums').innerText = event.target.innerText + ' Albums';
                document.getElementById('album-covers').innerHTML = '';
                
                fetch('/albums?artist=' + event.target.innerText)
                    .then(response => response.json())
                    .then(data => {
                        data.forEach(album => {
                            const albumCover = document.createElement('img');
                            albumCover.src = album.image;
                            albumCover.alt = album.album;
                            albumCover.title = album.album;
                            albumCover.style.cursor = 'pointer';
                            albumCover.style.marginRight = '10px';
                            albumCover.addEventListener('click', function() {
                                alert('Album clicked: ' + album.album);
                                // Add logic to load and display songs for the selected album
                            });
                            document.getElementById('album-covers').appendChild(albumCover);
                        });
                    });
            }
        });
    </script>
</body>
</html>
