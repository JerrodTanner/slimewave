<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Album }} by {{ .Artist }}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#d8c8a9] p-5 font-sans">
<div class="absolute top-5 right-5">
  <a href="/index" class="bg-blue-600 text-white py-2 px-4 rounded-md shadow-md hover:bg-blue-700 transition-all">
    Back To Home
  </a>
</div>

<h1 class="text-3xl text-gray-800 mb-6 text-center">{{ .Album }} – {{ .Artist }}</h1>

<div id="album-cover" class="text-center mb-6">
  <img src="{{ .Image }}" alt="{{ .Album }} cover" class="rounded-md shadow-lg hover:shadow-xl transition-all max-w-xs mx-auto">
</div>

<ul class="space-y-4">
  {{ range .Songs }}
  <li class="bg-[#a77f5b] p-4 rounded-lg hover:bg-[#8e6c4b] transition-all">
    <p class="text-lg text-white text-center mb-4">{{ . }}</p>
    <audio controls class="w-full">
      <source src="/audio/{{ $.Artist }}/{{ $.Album }}/{{ . }}.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </li>
  {{ end }}
</ul>

<div class="mt-6 text-center">
  <a href="/artists" class="text-blue-600 hover:text-blue-800 transition-all">← Back to artists</a>
</div>

</body>
</html>
