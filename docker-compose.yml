services:
  slimewave:
    image: ghcr.io/jerrodtanner/slimewave:latest
    container_name: slimewave
    restart: unless-stopped
    expose:
      - "8001"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in .env}
    depends_on:
      - slimewave

  # Polls GHCR every 2 min; updates only containers labelled above, then cleans old images.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 120 --cleanup --label-enable
