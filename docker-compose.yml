services:
  slimewave:
    build:
      context: .
      dockerfile: Dockerfile
    image: slimewave:latest
    container_name: slimewave
    restart: unless-stopped
    expose:
      - "8001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set}
    depends_on:
      - slimewave
