<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#d8c8a9] p-5 font-sans">
<div class="absolute top-5 right-5">
    <a href="/index" class="bg-blue-600 text-white py-2 px-4 rounded-md shadow-md hover:bg-blue-700 transition-all">
        Back To Home
    </a>
</div>
<h1 class="text-3xl text-gray-800 mb-6">Artists</h1>

<div id="artist-buttons" class="flex flex-wrap justify-center gap-4">
    {{ range . }}
    <a href="/albums?artist={{ . }}" class="block w-1/3 px-6 py-3 text-lg text-white bg-[#a77f5b] rounded-lg shadow-lg hover:bg-[#8e6c4b] hover:shadow-xl transition-all">
        <button class="w-full h-full"> {{ . }} </button>
    </a>
    {{ end }}
</div>

</body>
</html>
