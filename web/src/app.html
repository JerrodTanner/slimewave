<!doctype html>
<html lang="en" data-theme="street" data-style="bold">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>ShineWave — Business automation, database & reporting consulting</title>
		<meta name="description" content="ShineWave builds reporting, databases and workflow automation for small businesses. Based in Fort Lauderdale, Florida. Less busywork, more business: book a free 30-minute call." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ShineWave" />
		<meta property="og:title" content="Less busywork. More business. | ShineWave" />
		<meta property="og:description" content="Reporting, databases and workflow automation for small businesses, from Fort Lauderdale, Florida. See real examples, then book a free 30-minute call." />
		<meta property="og:url" content="https://jerrodtanner.com/" />
		<meta property="og:image" content="https://jerrodtanner.com/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Less busywork. More business. The ShineWave landing page." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Applied before first paint so the chosen theme never flashes.
			// The full theme registry lives in src/lib/theme; this only needs
			// to know that the stored value is a plain theme id.
			try {
				// Versioned key: see lib/theme/theme.svelte.ts. A preference from
				// before the current house style must not outrank it.
				localStorage.removeItem('slimewave:theme');
				var stored = localStorage.getItem('slimewave:theme:v2');
				// Every visitor lands on Bold: only a Bold theme is honoured, and
				// a stored Clean or Homey one is dropped (lib/theme/theme.svelte.ts
				// does the same), so the tag's defaults above stand.
				if (stored === 'street' || stored === 'night') {
					document.documentElement.dataset.theme = stored;
				} else if (stored) {
					localStorage.removeItem('slimewave:theme:v2');
				}
			} catch (e) {
				/* private mode, blocked storage: the default theme is fine */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
