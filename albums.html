<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Artist }} Albums</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#d8c8a9] p-5 font-sans">
<div class="absolute top-5 right-5">
    <a href="/index" class="bg-blue-600 text-white py-2 px-4 rounded-md shadow-md hover:bg-blue-700 transition-all">
        Back To Home
    </a>
</div>
<h1 class="text-3xl text-gray-800 mb-6 text-center">{{ .Artist }} Albums</h1>

<ul class="space-y-6">
    {{ range $album, $image := .Albums }}
    <li class="bg-[#a77f5b] p-4 rounded-lg hover:bg-[#8e6c4b] transition-all">
        <p class="text-lg text-white mb-4 text-center">{{ $album }}</p>
        <a href="/songs?artist={{ $.Artist }}&album={{ $album }}">
            <img src="/audio/{{ $.Artist }}/{{ $album }}/cover.jpg" alt="{{ $album }} cover" class="rounded-md shadow-md hover:shadow-lg transition-all max-w-xs mx-auto">
        </a>
    </li>
    {{ end }}
</ul>

</body>
</html>
