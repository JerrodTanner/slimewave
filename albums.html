<!-- handlers/albums.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{{ .Artist }} Albums</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>{{ .Artist }} Albums</h1>
    <ul>
        {{ range $album, $image := .Albums }}
        <li>
            <p>{{ $album }}</p>
            <a href="/songs?artist={{ $.Artist }}&album={{ $album }}"><img src="/audio/{{ $.Artist }}/{{ $album }}/cover.jpg" alt="{{ $album }} cover"></a>
        </li>
        {{ end }}
    </ul>
</body>
</html>
